name: Release

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    build-release:
        name: Build & publish Windows x64 installer
        runs-on: windows-latest

        # The installer is deliberately not Authenticode-signed, so provenance is the only
        # cryptographic link between a downloaded .exe and the source it claims to come from.
        # `id-token` lets the runner obtain the OIDC token the attestation is issued against;
        # `attestations` lets it record the result. Neither grants access to repository contents.
        permissions:
            contents: write
            id-token: write
            attestations: write

        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  fetch-depth: 0

            # `github.*` context values never reach a `run:` body directly: GitHub expands
            # expressions into the script text before the shell parses it, so a crafted ref name
            # would become PowerShell source. They are passed as environment variables instead,
            # which the shell reads as data. Enforced by scripts/test-release-workflow.ps1.
            - name: Verify release source
              shell: pwsh
              env:
                  COMMIT_SHA: ${{ github.sha }}
              run: powershell -NoProfile -File scripts/verify-release-source.ps1 -Commit $env:COMMIT_SHA -MasterRef "origin/master"

            - name: Setup Node.js
              uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
              with:
                  node-version-file: '.node-version'
                  cache: npm

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: 1.96.0
                  targets: x86_64-pc-windows-msvc

            - name: Install dependencies
              run: npm ci

            - name: Verify release version
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: powershell -NoProfile -File scripts/verify-release-version.ps1 -Tag $env:RELEASE_TAG

            - name: Test release source verification
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-release-source.ps1

            - name: Test release workflow tag transport
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-release-workflow.ps1

            - name: Test release manifest preparation
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-prepare-release-manifest.ps1

            - name: Test release notes preparation
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-release-notes.ps1

            - name: Test updater signature verification
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-updater-signature.ps1

            - name: Test updater signature verification wrapper
              shell: pwsh
              run: powershell -NoProfile -File scripts/test-verify-updater-signature-wrapper.ps1

            - name: Lint frontend
              run: npm run lint

            - name: Check frontend formatting
              run: npm run format:check

            # A tag can be pushed from a branch `verify.yml` never ran on, so the boundary scripts
            # that gate a merge have to gate a publication too.
            - name: Verify frontend dependency boundaries
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-frontend-boundaries.ps1

            - name: Verify Windows API ownership boundary
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-platform-boundaries.ps1

            - name: Run frontend tests
              run: npm test

            - name: Type-check frontend
              run: npm run typecheck

            - name: Build frontend
              run: npm run build

            - name: Run Rust tests
              run: cargo test --locked --manifest-path src-tauri/Cargo.toml

            - name: Check Rust formatting
              run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

            - name: Lint Rust
              run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

            # A failed tag build can leave a draft release with an orphaned tag after a
            # release tag is corrected. Remove only this version's draft before Tauri
            # Action creates its authoritative replacement.
            - name: Remove stale draft release
              shell: pwsh
              run: |
                  $releases = gh api "repos/$env:REPOSITORY/releases" | ConvertFrom-Json
                  $staleName = "KesVio $env:RELEASE_TAG"
                  $stale = $releases | Where-Object {
                    $_.draft -and $_.name -eq $staleName
                  }
                  foreach ($release in $stale) {
                    gh api --method DELETE "repos/$env:REPOSITORY/releases/$($release.id)"
                  }
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}

            # Keep the release in draft until latest.json is normalized and verified.
            - name: Build, sign & create draft release
              uses: tauri-apps/tauri-action@42e9df6c59070d114bf90dcd3943a1b8f138b113 # v0.5.20
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  tagName: ${{ github.ref_name }}
                  releaseName: 'KesVio ${{ github.ref_name }}'
                  releaseDraft: true
                  prerelease: false

            - name: Generate and apply release notes
              shell: pwsh
              run: |
                  $generatedPath = Join-Path $env:RUNNER_TEMP "generated-release-notes.md"
                  $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
                  gh api --method POST "repos/$env:REPOSITORY/releases/generate-notes" `
                    -f "tag_name=$env:RELEASE_TAG" `
                    -f "target_commitish=$env:COMMIT_SHA" `
                    --jq ".body" | Set-Content -LiteralPath $generatedPath -Encoding utf8NoBOM
                  powershell -NoProfile -File scripts/compose-release-notes.ps1 `
                    -CuratedPath ".github/release-notes.md" `
                    -GeneratedPath $generatedPath `
                    -OutputPath $notesPath
                  gh release edit $env:RELEASE_TAG --notes-file $notesPath
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPOSITORY: ${{ github.repository }}
                  RELEASE_TAG: ${{ github.ref_name }}
                  COMMIT_SHA: ${{ github.sha }}

            - name: Collect signed bundle assets
              shell: pwsh
              env:
                RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  $version = $env:RELEASE_TAG.TrimStart('v')
                  New-Item -ItemType Directory -Force -Path release-assets | Out-Null
                  Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/KesVio_${version}_x64-setup.exe" -Destination release-assets
                  Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/KesVio_${version}_x64-setup.exe.sig" -Destination release-assets
                  # sha256sum's own format, so `sha256sum -c` and `Get-FileHash` both work on it.
                  $setupName = "KesVio_${version}_x64-setup.exe"
                  $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "release-assets/$setupName").Hash.ToLowerInvariant()
                  Set-Content -LiteralPath "release-assets/SHA256SUMS.txt" -Value "$hash  $setupName" -Encoding utf8NoBOM

            - name: Verify updater signature
              shell: pwsh
              env:
                RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  $version = $env:RELEASE_TAG.TrimStart('v')
                  $setupPath = "release-assets/KesVio_${version}_x64-setup.exe"
                  powershell -NoProfile -File scripts/verify-updater-signature.ps1 `
                    -InstallerPath $setupPath `
                    -SignaturePath "$setupPath.sig"

            - name: Prepare updater manifest
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
                  powershell -NoProfile -File scripts/prepare-release-manifest.ps1 `
                    -AssetsDir release-assets `
                    -Tag $env:RELEASE_TAG `
                    -NotesPath $notesPath

            - name: Verify release assets
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
              run: powershell -NoProfile -File scripts/verify-release-assets.ps1 -AssetsDir release-assets -Tag $env:RELEASE_TAG

            # Attests the exact bytes that were just verified, so `gh attestation verify` ties the
            # published installer to this workflow, this repository and this commit. It replaces
            # nothing: SmartScreen still warns, and the updater still checks its own signature.
            - name: Attest build provenance
              uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-path: release-assets/KesVio_*_x64-setup.exe

            - name: Replace manifest and publish release
              shell: pwsh
              run: |
                  gh release upload $env:RELEASE_TAG release-assets/latest.json --clobber
                  gh release upload $env:RELEASE_TAG release-assets/SHA256SUMS.txt --clobber
                  gh release edit $env:RELEASE_TAG --draft=false
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ github.ref_name }}
