name: Security audit

# Dependency vulnerability scanning, kept separate from the release pipeline so
# an advisory never blocks a tagged build. Runs weekly (new advisories land
# against unchanged code) and on demand.
on:
    schedule:
        - cron: '0 6 * * 1'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    npm-audit:
        # Windows so the triage script runs under the same Windows PowerShell dialect the
        # repository's other verification scripts are written and locally tested against.
        name: npm audit
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: '.node-version'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            # Runtime dependencies admit no exceptions.
            - name: Audit runtime dependencies
              run: npm audit --omit=dev --audit-level=high

            # The full tree is triaged rather than gated on a bare exit code: a permanently red
            # job is not triage, because a genuinely new advisory hides behind the known one.
            - name: Triage development dependency advisories
              shell: pwsh
              run: powershell -NoProfile -File scripts/verify-npm-audit.ps1

    cargo-audit:
        name: cargo audit
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Rust
              uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
              with:
                  toolchain: 1.96.0

            - name: Install cargo-audit
              run: cargo install cargo-audit --version 0.22.2 --locked

            # Run from src-tauri so cargo-audit picks up src-tauri/.cargo/audit.toml, where each
            # accepted advisory is documented with its chain, owner and review date.
            - name: Audit Rust dependencies
              working-directory: src-tauri
              run: cargo audit
